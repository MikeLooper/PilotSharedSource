openapi: 3.1.1
info:
  title: PilotApi
  description: A proof of concept API to explore best-practices and
    new ideas.
  contact:
    name: Michael Looper
    url: https://github.com/MikeLooper
    email: MikelLooper@gmail.com
  license:
    name: MIT
    url: https://opensource.org
  version: 1.0.0
  summary: Proof of concept API
servers:
  - url: http://localhost:55099/
paths:
  /healthcheck:
    get:
      tags:
        - System
      summary: Return an OK.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalServerError'
  /about:
    get:
      tags:
        - System
      summary: Returns application metadata and optional configuration details.
      parameters:
        - name: show-details
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutResponse"
        "500":
          $ref: '#/components/responses/InternalServerError'
