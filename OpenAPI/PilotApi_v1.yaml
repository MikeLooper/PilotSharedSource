        title:
          description: A short, human-readable summary of the problem type. It should not change between occurrences of the same error.
          type:
            - "null"
            - string
          example: Missing request parameter
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          pattern: ^-?(?:0|[1-9]\d*)$
