        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type:
            - "null"
            - string
          example: The request is missing an expected query or path parameter.
        instance:
          description: A URI reference that identifies the specific occurrence of the problem (often the request path).
          type:
            - "null"
            - string
          example: /api/checkout/session_9281a
      additionalProperties: true
