components:
  parameters:
    ApiVersionHeader:
      name: X-Api-Version
      in: header
      description: The version of the API that should be used for the current call.  If missing, the application default version will be used.
      required: false
      schema:
        type: string
        maxLength: 15
        example: "1.2.3"
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      description: Unique identifier used for tracing a transaction across microservices.
      required: false
      schema:
        type: string
        format: uuid
        maxLength: 40
        example: "7ea2c7f7-8b46-475d-86f8-7aaaa9e4a35b"
    PageQuery:
      name: page
      in: query
      description: The number of the page (within a dataset) to start with during data retrieval.
      required: false
      schema:
        pattern: ^-?(?:0|[1-9]\d*)$
        type:
          - integer
          - string
        format: int32
        default: 0
    PageSizeQuery:
      name: pageSize
      in: query
      description: The number of items to return during data retrieval.
      required: false
      schema:
        pattern: ^-?(?:0|[1-9]\d*)$
        type:
          - integer
          - string
        format: int32
        default: 20
  responses:
    BadRequest:
      description: Bad Request — The server could not understand the request due to invalid syntax or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetailsBadRequest'
    Unauthorized:
      description: Unauthorized — Authentication is required or the provided credentials are invalid or expired.
      content:
        application/json:
          schema:
            type: string
    Forbidden:
      description: Forbidden — The authenticated user does not have permission to access the requested resource.
      content:
        application/json:
          schema:
            type: string
    InternalServerError:
      description: Internal Server Error — An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    AboutResponse:
      type: object
      properties:
        apiVersion:
          type:
            - "null"
            - string
        applicationConfiguration:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/IApplicationConfiguration"
        buildVersion:
          type:
            - "null"
            - string
        deployDate:
          type:
            - "null"
            - string
        name:
          type:
            - "null"
            - string
    AddResponseInt:
      type: object
      properties:
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
          format: int64
          minimum: 1
          maximum: 2147483647
    AddResponseOrderDetails:
      required:
        - orderId
        - productId
      type: object
      properties:
        orderId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
          minimum: 1
          maximum: 2147483647
          minLength: 1
          maxLength: 10
        productId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
          minimum: 1
          maximum: 2147483647
          minLength: 1
          maxLength: 10
    AddResponseString:
      type: object
      properties:
        id:
          type:
            - string
          minLength: 5
          maxLength: 5
    CategoriesDto:
      required:
        - categoryName
      type: object
      properties:
        categoryId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int32
          minimum: 1
          maximum: 2147483647
          minLength: 1
          maxLength: 10
        categoryName:
          type:
            - string
          minLength: 1
          maxLength: 15
        description:
          type:
            - "null"
            - string
        picture:
          type:
            - "null"
            - string
          format: byte
    CustomersDto:
      required:
        - companyName
        - customerId
      type: object
      properties:
        address:
          type:
            - "null"
            - string
          maxLength: 60
        city:
          type:
            - "null"
            - string
          maxLength: 15
        companyName:
          type:
            - string
          minLength: 1
          maxLength: 40
        contactName:
          type:
            - "null"
            - string
          maxLength: 30
        contactTitle:
          type:
            - "null"
            - string
          maxLength: 30
        country:
          type:
            - "null"
            - string
          maxLength: 15
        customerId:
          type:
            - string
          minLength: 5
          maxLength: 5
        fax:
          type:
            - "null"
            - string
          maxLength: 24
        phone:
          type:
            - "null"
            - string
          maxLength: 24
        postalCode:
          type:
            - "null"
            - string
          maxLength: 10
        region:
          type:
            - "null"
            - string
          maxLength: 15
    DataConnectionConfiguration:
      type: object
      properties:
        connectTimeout:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Gets or sets the connection timeout in seconds. A value of 0
            indicates no timeout.
          format: int32
        dataSourceName:
          type:
            - "null"
            - string
          description: "Gets or sets the name of the related data source settings
            section.\r

            This value will match an Application.DataSources[???].DataSourceName
            setting."
        host:
          type:
            - "null"
            - string
          description: Gets or sets the data source host (e.g., "localhost")
        port:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Gets or sets the data source port number. A value of null indicates
            the default port for the specified data source type.
          format: int32
        active:
          type: boolean
          description: Gets or sets a flag that indicates whether this settings object is
            active.
      description: Configuration for a data source connection.
    DataSourceConfiguration:
      type: object
      properties:
        dataSource:
          type:
            - "null"
            - string
          description: "Gets or sets the name of the data source (aka: a database)."
        dataSourceEnum:
          description: "Gets or sets the data source type.\r

            This will one of the DataSourceTypes options."
          $ref: "#/components/schemas/DataSourceTypes"
        dataSourceName:
          type:
            - "null"
            - string
          description: "Gets or sets the name of the current data source settings
            section.\r

            This value will match an
            Application.DataConnections[???].DataSourceName setting."
        dataSourceType:
          type:
            - "null"
            - string
          description: "Gets or sets the data source type (e.g., \"SqlServer\",
            \"PostgreSQL\").\r

            This value must match one of the DataSourceTypes options, in string
            form."
        schema:
          type:
            - "null"
            - string
          description: "Gets or sets the data source schema (e.g., \"dbo\")\r

            For best results, do not include delimiters ([,],\") on this value."
        active:
          type: boolean
          description: Gets or sets a flag that indicates whether this settings object is
            active.
      description: A base class for configuration objects.
    DataSourceTypes:
      type: integer
      description: Enums for the available data sources.
    EmployeesDto:
      required:
        - firstName
        - lastName
      type: object
      properties:
        address:
          type:
            - "null"
            - string
          maxLength: 60
        birthDate:
          type:
            - "null"
            - string
          format: date-time
          description: Must be earlier than the current date. Valid range is
            1753-01-01 through 9999-12-31 (SQL Server DATETIME).
        city:
          type:
            - "null"
            - string
          maxLength: 15
        country:
          type:
            - "null"
            - string
          maxLength: 15
        employeeId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int32
          minimum: 1
          maximum: 2147483647
          minLength: 1
          maxLength: 10
        extension:
          type:
            - "null"
            - string
          maxLength: 4
        firstName:
          type:
            - string
          minLength: 1
          maxLength: 10
        hireDate:
          type:
            - "null"
            - string
          format: date-time
          description: Valid range is 1753-01-01 through 9999-12-31 (SQL Server
            DATETIME).
        homePhone:
          type:
            - "null"
            - string
          maxLength: 24
        lastName:
          type:
            - string
          minLength: 1
          maxLength: 20
        notes:
          type:
            - "null"
            - string
        photo:
          type:
            - "null"
            - string
          format: byte
        photoPath:
          type:
            - "null"
            - string
          maxLength: 255
        postalCode:
          type:
            - "null"
            - string
          maxLength: 10
        region:
          type:
            - "null"
            - string
          maxLength: 15
        reportsTo:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int32
          minimum: 1
          maximum: 2147483647
          minLength: 1
          maxLength: 10
          description: The employeeId of this employee's manager.
        title:
          type:
            - "null"
            - string
          maxLength: 30
        titleOfCourtesy:
          type:
            - "null"
            - string
          maxLength: 25
    IApplicationConfiguration:
      type: object
      properties:
        dataConnections:
          type:
            - "null"
            - array
          items:
            $ref: "#/components/schemas/DataConnectionConfiguration"
          description: Gets or sets the list of data connection configurations for the
            application.
        dataSources:
          type:
            - "null"
            - array
          items:
            $ref: "#/components/schemas/DataSourceConfiguration"
          description: Gets or sets the list of data source configurations for the
            application.
        security:
          oneOf:
            - type: "null"
            - description: Gets or sets an object with Security settings.
              $ref: "#/components/schemas/SecurityConfiguration"
        openApi:
          oneOf:
            - type: "null"
            - description: Gets or sets an object with OpenApi settings.
              $ref: "#/components/schemas/OpenApiConfiguration"
        openTelemetry:
          oneOf:
            - type: "null"
            - description: Gets or sets an object with Open Telemetry settings.
              $ref: "#/components/schemas/OpenTelemetryConfiguration"
        active:
          type: boolean
          description: Gets or sets a flag that indicates whether this settings object is
            active.
      description: Configuration for the application.
    OpenApiConfiguration:
      type: object
      properties:
        contact:
          oneOf:
            - type: "null"
            - description: Gets or sets a Contact object.
              $ref: "#/components/schemas/OpenApiContactConfiguration"
        description:
